<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">

<title>AEY GALAXY</title>

<style>

body{
  margin:0;
  overflow:hidden;
  background:black;
  font-family:Arial;
}

/* TOP UI */

#topbar{

  position:fixed;

  top:20px;
  left:20px;

  z-index:20;

  color:white;

  background:rgba(10,10,20,0.7);

  padding:18px;

  border-radius:18px;

  backdrop-filter:blur(10px);

  min-width:280px;

}

/* TITLE */

#logo{

  font-size:28px;

  font-weight:bold;

  margin-bottom:14px;

}

/* STATS */

.stat{

  margin-top:8px;

  font-size:16px;

}

/* PROGRESS */

#progress{

  width:100%;

  height:12px;

  background:rgba(255,255,255,0.08);

  border-radius:20px;

  overflow:hidden;

  margin-top:18px;

}

#progressFill{

  width:10%;

  height:100%;

  background:linear-gradient(
    90deg,
    #00c6ff,
    #0072ff
  );

}

/* BUTTONS */

#buttons{

  position:fixed;

  bottom:30px;

  left:50%;

  transform:translateX(-50%);

  display:flex;

  gap:16px;

  z-index:20;

}

button{

  padding:16px 28px;

  border:none;

  border-radius:18px;

  background:rgba(18,18,30,0.92);

  color:white;

  font-size:16px;

  cursor:pointer;

}

</style>

</head>

<body>

<!-- UI -->

<div id="topbar">

  <div id="logo">
    AEY GALAXY
  </div>

  <div class="stat" id="planetText">
    Planet: Terra Prime
  </div>

  <div class="stat" id="cityText">
    City Level: 1
  </div>

  <div class="stat" id="fragmentsText">
    Fragments: 0
  </div>

  <div class="stat" id="completionText">
    Completion: 0%
  </div>

  <div class="stat" id="economyText">
    Economy: Stable
  </div>

  <div id="progress">
    <div id="progressFill"></div>
  </div>

</div>

<!-- BUTTONS -->

<div id="buttons">

  <button onclick="buildCityUpgrade()">
    BUILD CITY
  </button>

  <button onclick="nextPlanet()">
    NEXT PLANET
  </button>

</div>

<!-- LIBS -->

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- GAME FILES -->

<script src="js/supabase.js"></script>

<script src="js/renderer.js"></script>

<script src="js/planets.js"></script>

<script src="js/game.js"></script>

<script src="js/ui.js"></script>

<script src="js/economy.js"></script>

<script src="js/pvp.js"></script>

</body>
</html>
