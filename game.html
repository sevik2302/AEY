<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AEY GALAXY</title>

<style>

body{
  margin:0;
  overflow:hidden;
  background:black;
  font-family:Arial,sans-serif;
}

/* =========================
   UI
========================= */

#topbar{

  position:fixed;

  top:20px;
  left:20px;

  color:white;

  z-index:20;

  background:rgba(10,10,20,0.7);

  padding:18px;

  border-radius:18px;

  backdrop-filter:blur(12px);

  min-width:280px;

  border:1px solid rgba(255,255,255,0.08);

}

#logo{

  font-size:30px;

  font-weight:bold;

  letter-spacing:2px;

  margin-bottom:14px;

}

.stat{

  margin-top:10px;

  font-size:16px;

  opacity:0.95;

}

#progress{

  width:100%;

  height:12px;

  background:rgba(255,255,255,0.08);

  border-radius:20px;

  margin-top:18px;

  overflow:hidden;

}

#progressFill{

  width:10%;

  height:100%;

  background:linear-gradient(
    90deg,
    #00c6ff,
    #0072ff
  );

  border-radius:20px;

  transition:0.4s;

}

#buttons{

  position:fixed;

  bottom:30px;

  left:50%;

  transform:translateX(-50%);

  display:flex;

  gap:16px;

  z-index:20;

}

button{

  padding:16px 28px;

  border:none;

  border-radius:18px;

  background:rgba(18,18,30,0.92);

  color:white;

  font-size:16px;

  cursor:pointer;

  backdrop-filter:blur(10px);

  border:1px solid rgba(255,255,255,0.08);

  transition:0.25s;

}

button:hover{

  transform:scale(1.06);

  background:rgba(40,40,70,0.95);

}

</style>
</head>

<body>

<!-- UI -->

<div id="topbar">

  <div id="logo">
    AEY GALAXY
  </div>

  <div class="stat" id="planetText">
    Planet: Terra Prime
  </div>

  <div class="stat" id="cityText">
    City Level: 1
  </div>

  <div class="stat" id="populationText">
    Population: 1.2B
  </div>

  <div class="stat" id="fragmentsText">
    Fragments: 0
  </div>

  <div class="stat" id="economyText">
    Economy: Stable
  </div>

  <div id="progress">
    <div id="progressFill"></div>
  </div>

</div>

<div id="buttons">

  <button onclick="upgradeCity()">
    BUILD CITY
  </button>

  <button onclick="nextPlanet()">
    NEXT PLANET
  </button>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================
   SCENE
========================= */

const scene = new THREE.Scene();

/* =========================
   CAMERA
========================= */

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth/window.innerHeight,
  0.1,
  1000
);

camera.position.z = 6;

/* =========================
   RENDERER
========================= */

const renderer = new THREE.WebGLRenderer({
  antialias:true
});

renderer.setPixelRatio(
  window.devicePixelRatio
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

document.body.appendChild(
  renderer.domElement
);

/* =========================
   LIGHTING
========================= */

scene.add(
  new THREE.AmbientLight(
    0x404040,
    2
  )
);

const sun =
  new THREE.PointLight(
    0xffffff,
    7,
    100
  );

sun.position.set(
  10,
  6,
  8
);

scene.add(sun);

/* =========================
   STARS
========================= */

const starsGeometry =
  new THREE.BufferGeometry();

const starsVertices = [];

for(let i=0;i<12000;i++){

  starsVertices.push(
    (Math.random()-0.5)*500
  );

  starsVertices.push(
    (Math.random()-0.5)*500
  );

  starsVertices.push(
    (Math.random()-0.5)*500
  );

}

starsGeometry.setAttribute(

  "position",

  new THREE.Float32BufferAttribute(
    starsVertices,
    3
  )

);

const stars =
  new THREE.Points(

    starsGeometry,

    new THREE.PointsMaterial({
      color:0xffffff,
      size:0.08
    })

  );

scene.add(stars);

/* =========================
   TEXTURES
========================= */

const loader =
  new THREE.TextureLoader();

const earthTexture =
  loader.load(
    "https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg"
  );

const earthNight =
  loader.load(
    "https://threejs.org/examples/textures/planets/earth_lights_2048.png"
  );

const cloudsTexture =
  loader.load(
    "https://threejs.org/examples/textures/planets/earth_clouds_1024.png"
  );

/* =========================
   PLANET
========================= */

const planet =
  new THREE.Mesh(

    new THREE.SphereGeometry(
      2,
      128,
      128
    ),

    new THREE.MeshStandardMaterial({

      map:earthTexture,

      emissiveMap:earthNight,

      emissive:new THREE.Color(
        0xffffff
      ),

      emissiveIntensity:0.35,

      roughness:1

    })

  );

scene.add(planet);

/* =========================
   CLOUDS
========================= */

const clouds =
  new THREE.Mesh(

    new THREE.SphereGeometry(
      2.03,
      128,
      128
    ),

    new THREE.MeshStandardMaterial({

      map:cloudsTexture,

      transparent:true,

      opacity:0.45

    })

  );

scene.add(clouds);

/* =========================
   ATMOSPHERE
========================= */

const atmosphere =
  new THREE.Mesh(

    new THREE.SphereGeometry(
      2.08,
      128,
      128
    ),

    new THREE.MeshBasicMaterial({

      color:0x4da6ff,

      transparent:true,

      opacity:0.12

    })

  );

scene.add(atmosphere);

/* =========================
   CITY SYSTEM
========================= */

const cityGroup =
  new THREE.Group();

scene.add(cityGroup);

/* =========================
   GAME VALUES
========================= */

let cityLevel = 1;
let fragments = 0;
let currentPlanet = 0;

const planets = [
  "Terra Prime",
  "Nova Lux",
  "Cryon",
  "Vortex IX",
  "Aether"
];

/* =========================
   BUILD CITY
========================= */

function buildCity(level){

  cityGroup.clear();

  const radius = 2.01;

  /* 🌆 CITY CLUSTERS */
  const megaCities =
    6 + level;

  for(let c=0;c<megaCities;c++){

    const cityPhi =
      Math.random() *
      Math.PI * 2;

    const cityTheta =
      Math.acos(
        (Math.random()*2)-1
      );

    const cityX =
      radius *
      Math.sin(cityTheta) *
      Math.cos(cityPhi);

    const cityY =
      radius *
      Math.cos(cityTheta);

    const cityZ =
      radius *
      Math.sin(cityTheta) *
      Math.sin(cityPhi);

    const buildings =
      18 + level*2;

    for(let i=0;i<buildings;i++){

      const type = Math.random();

      let height;
      let width;
      let color;

      /* suburbs */
      if(type < 0.7){

        height =
          0.02 +
          Math.random()*0.05;

        width = 0.012;

        color = 0xbfbfbf;
      }

      /* downtown */
      else if(type < 0.94){

        height =
          0.08 +
          Math.random()*0.16;

        width = 0.018;

        color = 0xdedede;
      }

      /* skyscrapers */
      else{

        height =
          0.25 +
          Math.random()*0.5;

        width = 0.03;

        color = 0xaad6ff;
      }

      const building =
        new THREE.Mesh(

          new THREE.BoxGeometry(
            width,
            height,
            width
          ),

          new THREE.MeshStandardMaterial({

            color:color,

            emissive:new THREE.Color(
              0x222222
            ),

            metalness:0.35

          })

        );

      const spread = 0.22;

      building.position.set(

        cityX +
        (Math.random()-0.5)*spread,

        cityY +
        (Math.random()-0.5)*spread,

        cityZ +
        (Math.random()-0.5)*spread

      );

      building.lookAt(0,0,0);

      building.translateY(
        height/2
      );

      cityGroup.add(building);
    }
  }
}

/* INITIAL CITY */

buildCity(cityLevel);

/* =========================
   BUILD BUTTON
========================= */

function upgradeCity(){

  cityLevel++;

  fragments += 150;

  buildCity(cityLevel);

  document.getElementById(
    "cityText"
  ).innerText =
    "City Level: " +
    cityLevel;

  document.getElementById(
    "populationText"
  ).innerText =
    "Population: " +
    (1.2 + cityLevel*0.25).toFixed(1)
    + "B";

  document.getElementById(
    "fragmentsText"
  ).innerText =
    "Fragments: " +
    fragments;

  document.getElementById(
    "progressFill"
  ).style.width =
    Math.min(
      cityLevel*6,
      100
    ) + "%";
}

/* =========================
   NEXT PLANET
========================= */

function nextPlanet(){

  currentPlanet++;

  if(currentPlanet >= planets.length){

    currentPlanet = 0;

  }

  document.getElementById(
    "planetText"
  ).innerText =
    "Planet: " +
    planets[currentPlanet];

  /* 🌍 DIFFERENT COLORS */

  const colors = [
    0xffffff,
    0xffcccc,
    0xaad6ff,
    0xffe0aa,
    0xd6b3ff
  ];

  planet.material.emissive =
    new THREE.Color(
      colors[currentPlanet]
    );
}

/* =========================
   CAMERA CONTROL
========================= */

let mouseX = 0;
let mouseY = 0;

document.addEventListener(
  "mousemove",
  e=>{

    mouseX =
      (e.clientX /
      window.innerWidth - 0.5);

    mouseY =
      (e.clientY /
      window.innerHeight - 0.5);

  }
);

/* =========================
   ANIMATION
========================= */

function animate(){

  requestAnimationFrame(
    animate
  );

  planet.rotation.y += 0.0011;

  clouds.rotation.y += 0.0015;

  atmosphere.rotation.y += 0.001;

  cityGroup.rotation.y += 0.0011;

  camera.position.x +=
    (mouseX*0.8 - camera.position.x)
    *0.02;

  camera.position.y +=
    (-mouseY*0.5 - camera.position.y)
    *0.02;

  camera.lookAt(0,0,0);

  renderer.render(
    scene,
    camera
  );
}

animate();

/* =========================
   RESIZE
========================= */

window.addEventListener(
  "resize",
  ()=>{

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);

</script>

</body>
</html>
