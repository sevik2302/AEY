<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AEY GALAXY</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:black;
  font-family:Arial;
}

#topbar{
  position:fixed;
  top:20px;
  left:20px;
  z-index:20;
  color:white;
  background:rgba(10,10,20,0.7);
  padding:18px;
  border-radius:18px;
  backdrop-filter:blur(10px);
  min-width:260px;
}

#logo{
  font-size:26px;
  font-weight:bold;
  margin-bottom:12px;
}

.stat{
  margin-top:6px;
  font-size:15px;
}

#progress{
  width:100%;
  height:10px;
  background:rgba(255,255,255,0.1);
  border-radius:10px;
  margin-top:14px;
  overflow:hidden;
}

#progressFill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#00c6ff,#0072ff);
}

#buttons{
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:12px;
  z-index:20;
}

button{
  padding:14px 20px;
  border:none;
  border-radius:14px;
  background:#111;
  color:white;
  cursor:pointer;
}
</style>

</head>

<body>

<!-- UI -->
<div id="topbar">

  <div id="logo">AEY GALAXY</div>

  <div class="stat" id="planetText">Planet</div>
  <div class="stat" id="cityText">City Level: 1</div>
  <div class="stat" id="fragmentText">Fragments: 0</div>
  <div class="stat" id="completionText">Completion: 0%</div>
  <div class="stat" id="costText">Next Cost: 100</div>

  <div id="progress">
    <div id="progressFill"></div>
  </div>

</div>

<!-- BUTTONS -->
<div id="buttons">

  <button onclick="tapFragments()">
    TAP +1
  </button>

  <button onclick="buildCityUpgrade()">
    BUILD
  </button>

  <button onclick="nextPlanet()">
    NEXT
  </button>

</div>

<!-- LIBS -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<!-- SCRIPTS -->
<script src="js/renderer.js"></script>
<script src="js/planets.js"></script>
<script src="js/game.js"></script>
<script src="js/economy.js"></script>
<script src="js/ui.js"></script>

</body>
</html>
