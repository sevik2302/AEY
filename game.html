<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AEY GALAXY</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:black;
  font-family:Arial, sans-serif;
}

/* UI PANEL */
#ui{
  position:fixed;
  bottom:25px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:14px;
  z-index:10;
}

/* BUTTONS */
button{
  padding:14px 24px;
  border:none;
  border-radius:16px;
  background:rgba(15,15,25,0.9);
  color:white;
  font-size:16px;
  cursor:pointer;
  backdrop-filter:blur(10px);
  transition:0.2s;
  border:1px solid rgba(255,255,255,0.08);
}

button:hover{
  transform:scale(1.06);
  background:rgba(35,35,55,0.95);
}

/* INFO */
#info{
  position:fixed;
  top:20px;
  left:20px;
  z-index:10;
  color:white;
}

#title{
  font-size:28px;
  font-weight:bold;
  letter-spacing:2px;
  margin-bottom:12px;
}

.stat{
  margin-top:8px;
  font-size:17px;
  opacity:0.92;
}

/* BUILD BAR */
#bar{
  width:240px;
  height:12px;
  background:rgba(255,255,255,0.1);
  border-radius:20px;
  overflow:hidden;
  margin-top:10px;
}

#fill{
  width:10%;
  height:100%;
  background:linear-gradient(
    90deg,
    #00c6ff,
    #0072ff
  );
  border-radius:20px;
  transition:0.35s;
}
</style>
</head>

<body>

<!-- INFO -->
<div id="info">

  <div id="title">
    AEY GALAXY
  </div>

  <div class="stat" id="planetText">
    Planet Level: 1
  </div>

  <div class="stat" id="cityText">
    City Level: 1
  </div>

  <div class="stat" id="populationText">
    Population: 1.2M
  </div>

  <div class="stat" id="economyText">
    Economy: Stable
  </div>

  <div id="bar">
    <div id="fill"></div>
  </div>

</div>

<!-- UI -->
<div id="ui">

  <button onclick="upgradeCity()">
    BUILD CITY
  </button>

  <button onclick="upgradePlanet()">
    NEXT PLANET
  </button>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================
   SCENE
========================= */

const scene = new THREE.Scene();

/* =========================
   CAMERA
========================= */

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth/window.innerHeight,
  0.1,
  1000
);

camera.position.z = 6;

/* =========================
   RENDERER
========================= */

const renderer = new THREE.WebGLRenderer({
  antialias:true
});

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setPixelRatio(
  window.devicePixelRatio
);

document.body.appendChild(
  renderer.domElement
);

/* =========================
   LIGHTING
========================= */

scene.add(
  new THREE.AmbientLight(0x404040,2)
);

const sun = new THREE.PointLight(
  0xffffff,
  6,
  100
);

sun.position.set(10,5,10);

scene.add(sun);

/* =========================
   STARS
========================= */

const starsGeometry =
  new THREE.BufferGeometry();

const starsVertices = [];

for(let i=0;i<7000;i++){

  starsVertices.push(
    (Math.random()-0.5)*400
  );

  starsVertices.push(
    (Math.random()-0.5)*400
  );

  starsVertices.push(
    (Math.random()-0.5)*400
  );
}

starsGeometry.setAttribute(
  "position",
  new THREE.Float32BufferAttribute(
    starsVertices,
    3
  )
);

const starsMaterial =
  new THREE.PointsMaterial({
    color:0xffffff,
    size:0.12
  });

const stars = new THREE.Points(
  starsGeometry,
  starsMaterial
);

scene.add(stars);

/* =========================
   TEXTURES
========================= */

const loader =
  new THREE.TextureLoader();

const earthTexture =
  loader.load(
    "https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg"
  );

const earthNight =
  loader.load(
    "https://threejs.org/examples/textures/planets/earth_lights_2048.png"
  );

const cloudsTexture =
  loader.load(
    "https://threejs.org/examples/textures/planets/earth_clouds_1024.png"
  );

/* =========================
   PLANET
========================= */

const planet = new THREE.Mesh(

  new THREE.SphereGeometry(
    2,
    128,
    128
  ),

  new THREE.MeshStandardMaterial({

    map:earthTexture,

    emissiveMap:earthNight,

    emissive:new THREE.Color(
      0xffffff
    ),

    emissiveIntensity:0.28,

    roughness:1

  })

);

scene.add(planet);

/* =========================
   CLOUDS
========================= */

const clouds = new THREE.Mesh(

  new THREE.SphereGeometry(
    2.03,
    128,
    128
  ),

  new THREE.MeshStandardMaterial({

    map:cloudsTexture,

    transparent:true,

    opacity:0.45

  })

);

scene.add(clouds);

/* =========================
   ATMOSPHERE
========================= */

const atmosphere =
  new THREE.Mesh(

    new THREE.SphereGeometry(
      2.09,
      128,
      128
    ),

    new THREE.MeshBasicMaterial({

      color:0x4da6ff,

      transparent:true,

      opacity:0.14

    })

);

scene.add(atmosphere);

/* =========================
   CITY SYSTEM
========================= */

const cityGroup =
  new THREE.Group();

scene.add(cityGroup);

let cityLevel = 1;
let planetLevel = 1;

/* BUILD CITY */

function buildCity(level){

  cityGroup.clear();

  const radius = 2.01;

  const count =
    400 + level*120;

  for(let i=0;i<count;i++){

    const zone = Math.random();

    let height;

    /* suburbs */
    if(zone < 0.7){

      height =
        0.02 +
        Math.random()*0.06;

    }

    /* downtown */
    else if(zone < 0.94){

      height =
        0.08 +
        Math.random()*0.18;

    }

    /* megatowers */
    else{

      height =
        0.25 +
        Math.random()*0.55;

    }

    height += level*0.002;

    const building =
      new THREE.Mesh(

        new THREE.BoxGeometry(
          0.018,
          height,
          0.018
        ),

        new THREE.MeshStandardMaterial({

          color:0xdedede,

          emissive:new THREE.Color(
            0x222222
          ),

          metalness:0.3

        })

      );

    const phi =
      Math.random() *
      Math.PI * 2;

    const theta =
      Math.acos(
        (Math.random()*2)-1
      );

    const x =
      radius *
      Math.sin(theta) *
      Math.cos(phi);

    const y =
      radius *
      Math.cos(theta);

    const z =
      radius *
      Math.sin(theta) *
      Math.sin(phi);

    building.position.set(x,y,z);

    building.lookAt(0,0,0);

    building.translateY(
      height/2
    );

    cityGroup.add(building);
  }
}

/* FIRST BUILD */

buildCity(cityLevel);

/* =========================
   UPGRADE CITY
========================= */

function upgradeCity(){

  cityLevel++;

  buildCity(cityLevel);

  document.getElementById(
    "cityText"
  ).innerText =
    "City Level: " + cityLevel;

  document.getElementById(
    "populationText"
  ).innerText =
    "Population: " +
    (1.2 + cityLevel*0.8).toFixed(1)
    + "M";

  document.getElementById(
    "fill"
  ).style.width =
    Math.min(
      cityLevel*10,
      100
    ) + "%";
}

/* =========================
   NEXT PLANET
========================= */

function upgradePlanet(){

  planetLevel++;

  document.getElementById(
    "planetText"
  ).innerText =
    "Planet Level: " +
    planetLevel;

  /* slight color variation */
  planet.material.emissiveIntensity =
    0.2 + planetLevel*0.03;
}

/* =========================
   MOUSE ROTATION
========================= */

let mouseX = 0;
let mouseY = 0;

document.addEventListener(
  "mousemove",
  e=>{

    mouseX =
      (e.clientX /
      window.innerWidth - 0.5);

    mouseY =
      (e.clientY /
      window.innerHeight - 0.5);

  }
);

/* =========================
   ANIMATION
========================= */

function animate(){

  requestAnimationFrame(
    animate
  );

  planet.rotation.y += 0.0012;

  clouds.rotation.y += 0.0015;

  atmosphere.rotation.y += 0.001;

  cityGroup.rotation.y += 0.0012;

  camera.position.x +=
    (mouseX*0.6 - camera.position.x)
    *0.02;

  camera.position.y +=
    (-mouseY*0.4 - camera.position.y)
    *0.02;

  camera.lookAt(0,0,0);

  renderer.render(
    scene,
    camera
  );
}

animate();

/* =========================
   RESIZE
========================= */

window.addEventListener(
  "resize",
  ()=>{

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);

</script>

</body>
</html>
