<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AEY GALAXY FIXED</title>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>
<script src="js/game.js"></script>
<script src="js/renderer.js"></script>
<script src="js/planets.js"></script>

<style>
body{
  margin:0;
  overflow:hidden;
  background:black;
  font-family:Arial;
}

#hud{
  position:fixed;
  top:15px;
  left:15px;
  color:white;
  z-index:10;
  font-size:14px;
}

#panel{
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  justify-content:center;
  gap:10px;
  padding:15px;
  background:rgba(0,0,0,0.6);
}

.btn{
  padding:10px 16px;
  border-radius:10px;
  border:1px solid #444;
  background:#111;
  color:white;
  cursor:pointer;
}
.btn:active{
  transform:scale(0.95);
}
</style>

</head>

<body>

<div id="hud">
  <div id="frag">Fragments: 0</div>
  <div id="lvl">Planet lvl: 1</div>
  <div id="build">Build: 0</div>
  <div id="pvp">PvP: 0</div>
</div>

<div id="panel">
  <button class="btn" onclick="tap()">TAP</button>
  <button class="btn" onclick="build()">BUILD</button>
  <button class="btn" onclick="upgradePlanet()">UPGRADE</button>
</div>

<script>
(async ()=>{
  await init();
  startRenderer();
})();
</script>

</body>
</html>
