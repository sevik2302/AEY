<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>AEY Planet</title>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    overflow:hidden;
    background:#8ed8ff;
    font-family:Inter,Arial,sans-serif;
}

/* ===== TOP ===== */

#top{

    position:fixed;

    top:18px;

    left:18px;

    z-index:20;

    background:white;

    border-radius:28px;

    padding:18px 22px;

    box-shadow:
        0 10px 30px rgba(0,0,0,0.12);

}

#title{
    font-size:24px;
    font-weight:800;
    color:#2a2a2a;
}

#stats{
    margin-top:8px;
    line-height:1.7;
    color:#555;
    font-size:14px;
}

/* ===== BUTTONS ===== */

#bottom{

    position:fixed;

    bottom:22px;

    left:50%;

    transform:translateX(-50%);

    width:92%;

    display:flex;

    gap:14px;

    z-index:20;

}

.btn{

    flex:1;

    border:none;

    border-radius:26px;

    padding:18px;

    font-size:16px;

    font-weight:700;

    cursor:pointer;

    transition:0.15s;

    color:white;

    box-shadow:
        0 10px 20px rgba(0,0,0,0.12);

}

.btn:active{
    transform:scale(0.95);
}

#tapBtn{
    background:#5b8cff;
}

#buildBtn{
    background:#00c9a7;
}

#planetBtn{
    background:#ff8c42;
}

/* FLOAT TEXT */

.floatText{

    position:fixed;

    font-weight:800;

    color:white;

    pointer-events:none;

    animation:up 1s forwards;

    z-index:999;

}

@keyframes up{

    0%{
        opacity:0;
        transform:translateY(0px) scale(0.8);
    }

    20%{
        opacity:1;
    }

    100%{
        opacity:0;
        transform:translateY(-80px) scale(1.2);
    }

}

</style>
</head>

<body>

<div id="top">

    <div id="title">
        AEY PLANET
    </div>

    <div id="stats">
        Loading...
    </div>

</div>

<div id="bottom">

    <button
        id="tapBtn"
        class="btn"
    >
        Collect
    </button>

    <button
        id="buildBtn"
        class="btn"
    >
        Upgrade
    </button>

    <button
        id="planetBtn"
        class="btn"
    >
        Planet
    </button>

</div>

<script src="js/engine.js"></script>
<script src="js/planet.js"></script>
<script src="js/cities.js"></script>
<script src="js/ui.js"></script>
<script src="js/supabase.js"></script>
<script src="js/game.js"></script>

</body>
</html>
