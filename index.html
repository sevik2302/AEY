<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>AEY Planet Tycoon</title>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    overflow:hidden;
    font-family:Inter,Arial,sans-serif;
    background:#060816;
    color:white;
}

/* ===== TOP ===== */

#topbar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    padding:18px;
    z-index:20;
}

.panel{

    backdrop-filter:blur(18px);

    background:rgba(255,255,255,0.08);

    border:1px solid rgba(255,255,255,0.08);

    border-radius:26px;

    padding:18px;

    width:260px;

    box-shadow:
        0 12px 40px rgba(0,0,0,0.35),
        inset 0 1px rgba(255,255,255,0.08);

}

#title{
    font-size:24px;
    font-weight:800;
}

#stats{
    margin-top:10px;
    font-size:14px;
    line-height:1.7;
    opacity:0.9;
}

/* ===== BOTTOM BUTTONS ===== */

#bottomUI{

    position:fixed;

    bottom:26px;

    left:50%;

    transform:translateX(-50%);

    width:94%;

    display:flex;

    gap:14px;

    z-index:20;

}

.actionButton{

    flex:1;

    border:none;

    border-radius:24px;

    padding:18px;

    font-size:16px;

    font-weight:700;

    color:white;

    cursor:pointer;

    transition:0.18s;

    backdrop-filter:blur(16px);

    box-shadow:
      0 10px 30px rgba(0,0,0,0.35),
      inset 0 1px rgba(255,255,255,0.12);

}

.actionButton:active{
    transform:scale(0.95);
}

#tapBtn{
    background:linear-gradient(135deg,#6d7cff,#7d5cff);
}

#buildBtn{
    background:linear-gradient(135deg,#00c6a7,#00e0ff);
}

#planetBtn{
    background:linear-gradient(135deg,#ff9966,#ff5e62);
}

/* ===== FLOAT TEXT ===== */

.floatText{

    position:fixed;

    font-weight:700;

    pointer-events:none;

    animation:floatUp 1s forwards;

    z-index:999;

}

@keyframes floatUp{

    0%{
        opacity:0;
        transform:translateY(0px) scale(0.7);
    }

    20%{
        opacity:1;
    }

    100%{
        opacity:0;
        transform:translateY(-80px) scale(1.3);
    }

}

</style>
</head>

<body>

<div id="topbar">

    <div class="panel">

        <div id="title">
            AEY PLANET
        </div>

        <div id="stats">
            Loading...
        </div>

    </div>

</div>

<div id="bottomUI">

    <button
        id="tapBtn"
        class="actionButton"
    >
        Collect
    </button>

    <button
        id="buildBtn"
        class="actionButton"
    >
        Upgrade
    </button>

    <button
        id="planetBtn"
        class="actionButton"
    >
        New Planet
    </button>

</div>

<script src="js/engine.js"></script>
<script src="js/planet.js"></script>
<script src="js/cities.js"></script>
<script src="js/ui.js"></script>
<script src="js/supabase.js"></script>
<script src="js/game.js"></script>

</body>
</html>
