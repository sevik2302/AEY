<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>AEY PLANET</title>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{

    overflow:hidden;

    font-family:Inter,Arial,sans-serif;

    background:linear-gradient(
        to bottom,
        #55c8ff,
        #9fe9ff
    );

}

/* ===== CANVAS ===== */

canvas{
    display:block;
}

/* ===== TOP CARD ===== */

#topCard{

    position:fixed;

    top:22px;

    left:22px;

    width:300px;

    background:white;

    border-radius:30px;

    padding:22px;

    z-index:20;

    box-shadow:
        0 14px 40px rgba(0,0,0,0.16);

}

#title{

    font-size:26px;

    font-weight:900;

    color:#2f2f2f;

}

.stat{

    margin-top:18px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    font-size:18px;

    font-weight:700;

}

.blue{
    color:#2d86ff;
}

.green{
    color:#48c84d;
}

.orange{
    color:#ff8b28;
}

/* ===== BUTTONS ===== */

#bottomUI{

    position:fixed;

    bottom:24px;

    left:50%;

    transform:translateX(-50%);

    width:92%;

    display:flex;

    gap:18px;

    z-index:20;

}

.gameBtn{

    flex:1;

    border:none;

    border-radius:32px;

    padding:22px;

    color:white;

    font-size:22px;

    font-weight:800;

    cursor:pointer;

    transition:0.15s;

    box-shadow:
        inset 0 -8px rgba(0,0,0,0.12),
        0 14px 24px rgba(0,0,0,0.18);

}

.gameBtn:active{
    transform:scale(0.96);
}

#collectBtn{
    background:#2f7dff;
}

#upgradeBtn{
    background:#78df19;
}

#planetBtn{
    background:#ff9725;
}

/* ===== FLOAT TEXT ===== */

.floatText{

    position:fixed;

    font-size:24px;

    font-weight:900;

    color:white;

    pointer-events:none;

    animation:floatUp 1s forwards;

    z-index:999;

}

@keyframes floatUp{

    0%{
        opacity:0;
        transform:translateY(0px) scale(0.7);
    }

    20%{
        opacity:1;
    }

    100%{
        opacity:0;
        transform:translateY(-80px) scale(1.2);
    }

}

</style>
</head>

<body>

<div id="topCard">

    <div id="title">
        👑 AEY PLANET
    </div>

    <div class="stat">
        <span>💎 Fragments</span>
        <span id="fragmentsValue" class="blue">
            0
        </span>
    </div>

    <div class="stat">
        <span>⭐ Level</span>
        <span id="levelValue" class="green">
            1
        </span>
    </div>

    <div class="stat">
        <span>🟠 Population</span>
        <span id="populationValue" class="orange">
            120K
        </span>
    </div>

</div>

<div id="bottomUI">

    <button
        id="collectBtn"
        class="gameBtn"
    >
        👆 Collect
    </button>

    <button
        id="upgradeBtn"
        class="gameBtn"
    >
        ⬆ Upgrade
    </button>

    <button
        id="planetBtn"
        class="gameBtn"
    >
        🌍 Planet
    </button>

</div>

<script src="js/engine.js"></script>
<script src="js/planet.js"></script>
<script src="js/cities.js"></script>
<script src="js/ui.js"></script>
<script src="js/supabase.js"></script>
<script src="js/game.js"></script>

</body>
</html>
