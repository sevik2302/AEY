<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>AEY PLANET</title>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    overflow:hidden;
    font-family:Inter,Arial,sans-serif;
    background:linear-gradient(
        to bottom,
        #73d2ff,
        #a6ebff
    );
}

/* ===== CANVAS ===== */

canvas{
    display:block;
}

/* ===== TOP CARD ===== */

#topCard{

    position:fixed;

    top:24px;

    left:24px;

    width:320px;

    background:white;

    border-radius:30px;

    padding:22px;

    z-index:20;

    box-shadow:
        0 12px 40px rgba(0,0,0,0.15);

}

#title{

    font-size:28px;

    font-weight:900;

    color:#2d2d2d;

    display:flex;

    align-items:center;

    gap:12px;

}

.stat{

    margin-top:18px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    font-size:18px;

    font-weight:700;

    color:#3c3c3c;

}

.valueBlue{
    color:#2f89ff;
}

.valueGreen{
    color:#45c95b;
}

.valueOrange{
    color:#ff8a29;
}

/* ===== BUTTONS ===== */

#bottomUI{

    position:fixed;

    bottom:26px;

    left:50%;

    transform:translateX(-50%);

    width:92%;

    display:flex;

    gap:20px;

    z-index:20;

}

.gameBtn{

    flex:1;

    border:none;

    border-radius:30px;

    padding:24px;

    font-size:22px;

    font-weight:800;

    color:white;

    cursor:pointer;

    transition:0.15s;

    box-shadow:
        inset 0 -8px rgba(0,0,0,0.12),
        0 12px 25px rgba(0,0,0,0.16);

}

.gameBtn:active{
    transform:scale(0.96);
}

#collectBtn{
    background:#2f7cff;
}

#upgradeBtn{
    background:#6add35;
}

#planetBtn{
    background:#ff952b;
}

/* ===== FLOAT TEXT ===== */

.floatText{

    position:fixed;

    color:white;

    font-weight:900;

    font-size:24px;

    pointer-events:none;

    animation:floatUp 1s forwards;

    z-index:999;

}

@keyframes floatUp{

    0%{
        opacity:0;
        transform:translateY(0px) scale(0.7);
    }

    20%{
        opacity:1;
    }

    100%{
        opacity:0;
        transform:translateY(-80px) scale(1.2);
    }

}

</style>
</head>

<body>

<div id="topCard">

    <div id="title">
        👑 AEY PLANET
    </div>

    <div class="stat">
        <span>💎 Fragments</span>
        <span
            id="fragmentsValue"
            class="valueBlue"
        >
            0
        </span>
    </div>

    <div class="stat">
        <span>⭐ Level</span>
        <span
            id="levelValue"
            class="valueGreen"
        >
            1
        </span>
    </div>

    <div class="stat">
        <span>🟠 Population</span>
        <span
            id="populationValue"
            class="valueOrange"
        >
            120K
        </span>
    </div>

</div>

<div id="bottomUI">

    <button
        id="collectBtn"
        class="gameBtn"
    >
        👆 Collect
    </button>

    <button
        id="upgradeBtn"
        class="gameBtn"
    >
        ⬆ Upgrade
    </button>

    <button
        id="planetBtn"
        class="gameBtn"
    >
        🌎 Planet
    </button>

</div>

<script src="js/engine.js"></script>
<script src="js/planet.js"></script>
<script src="js/cities.js"></script>
<script src="js/ui.js"></script>
<script src="js/supabase.js"></script>
<script src="js/game.js"></script>

</body>
</html>
